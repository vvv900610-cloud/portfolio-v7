<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>圖片上傳測試</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#232522;font:15px/1.7 Arial,sans-serif}main{max-width:720px;margin:60px auto;padding:28px}section{background:#fafaf8;border:1px solid #d5d5cf;padding:24px}h1{font:32px Georgia,serif}label{display:block;margin-top:18px}input,button{font:inherit;padding:12px;border:1px solid #ccc;width:100%;margin:6px 0}button{background:#232522;color:white;cursor:pointer}button:disabled{opacity:.5}img{max-width:100%;max-height:400px}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:inherit}</style><main><a href="./">← 返回網站</a><h1>圖片上傳測試</h1><section><label>GitHub 授權權杖（僅限 portfolio-v7）</label><input id="token" type="password" autocomplete="off"><label>選擇測試圖片（JPG、PNG、WEBP，20 MB 以下）</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">測試上傳原圖</button><p id="status" role="status">尚未上傳</p><img id="preview" alt="" hidden></section><p>此頁只測試圖片寫入，不修改作品資料。權杖不會儲存於瀏覽器或程式碼。</p></main><script>const $=id=>document.getElementById(id);$("upload").onclick=async()=>{const token=$("token").value.trim(),f=$("file").files[0],ext=f&&({"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[f.type]);if(!token||!ext||f.size>20*1024*1024){$("status").textContent="請填入權杖並選擇支援的圖片（20 MB 以下）。";return}$("upload").disabled=true;$("status").textContent="正在上傳…";try{const bytes=new Uint8Array(await f.arrayBuffer());let raw="";for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.subarray(i,i+8192));const path="assets/test-"+crypto.randomUUID()+"."+ext;const r=await fetch("https://api.github.com/repos/vvv900610-cloud/portfolio-v7/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"Test original image upload",content:btoa(raw),branch:"main"})});const d=await r.json();if(!r.ok)throw Error("HTTP "+r.status+" — "+(d.message||r.statusText));$("status").textContent="上傳成功："+path+"\n原始大小："+f.size+" bytes。等待 GitHub Pages 部署。";$("preview").src=d.content.download_url;$("preview").hidden=false;$("token").value=""}catch(e){$("status").textContent="上傳失敗："+e.message}finally{$("upload").disabled=false}};</script></html>
