<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>作品集編輯器｜Portfolio Editor</title><style>
:root{--bg:#f6f5f1;--ink:#232522;--line:#d5d5cf;--muted:#747770}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:14px/1.6 Arial,"PingFang TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:22px clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}h1{font:normal 32px Georgia,serif;letter-spacing:-.035em;margin:0}h2{font-size:18px;font-weight:500;margin:0 0 16px}p{color:var(--muted)}.shell{max-width:1240px;padding:42px 24px 100px;margin:auto}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:35px}.top p{margin-bottom:0}.actions{display:flex;gap:9px;flex-wrap:wrap}button,.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 18px;display:inline-block;text-decoration:none;border-radius:0}.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.danger{color:#9f3f37;border-color:#b85e54}.layout{display:grid;grid-template-columns:300px 1fr;gap:28px}.panel{border:1px solid var(--line);background:#fafaf8;padding:24px}.side{align-self:start;position:sticky;top:20px}.project{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid var(--line);padding:13px 0;background:transparent;color:var(--ink);font-size:13px}.project.active{font-weight:bold}.meta{font-size:11px;color:var(--muted)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{min-width:0}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#50554e;margin-bottom:7px}input,select,textarea{width:100%;min-width:0;border:1px solid #cccfc8;border-radius:0;background:#fff;color:var(--ink);padding:12px}textarea{min-height:118px;resize:vertical}input[type=checkbox]{width:auto;accent-color:var(--ink)}input[type=file]{padding:10px;background:#f6f5f1}.check{display:flex;gap:10px;align-items:center}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px;align-items:center}.preview{width:100%;max-height:270px;object-fit:contain;background:#e8e5de;margin-top:12px}.help{font-size:12px;color:var(--muted);margin:8px 0}.divider{border:0;border-top:1px solid var(--line);margin:30px 0}.note{padding:16px;background:#e8e5de;font-size:12px;color:#4e544c}.hidden{display:none!important}#status{font-size:12px;color:var(--muted);min-height:20px}a{color:inherit}code{background:#e8e5de;padding:2px 5px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.top{display:block}.actions{margin-top:22px}.fields{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="meta">PORTFOLIO / CONTENT MANAGEMENT</div><h1>作品集編輯器</h1></div><a class="btn ghost" href="./index.html" target="_blank" rel="noopener">預覽網站 ↗</a></header>
<div class="shell"><div class="top"><div><h2>作品內容管理</h2><p>作品名稱、簡介與 About 使用繁體中文。連接 GitHub 後可直接上傳原圖及發布網站；也可匯出 JSON 備份。</p></div><div class="actions"><button class="ghost" id="connectBtn">連接 GitHub</button><button id="publishBtn">儲存並發布網站</button><button class="ghost" id="importBtn">匯入 JSON</button><button id="exportBtn">匯出網站資料 ↓</button><input id="importInput" type="file" accept=".json,application/json" hidden></div></div>
<div class="layout"><aside class="panel side"><h2>作品列表</h2><div id="items"></div><div class="row"><button id="add">＋ 新增作品</button></div><hr class="divider"><button class="ghost" id="settingsBtn" style="width:100%">網站基本設定</button><p class="help">作品順序即首頁排列順序，可在作品表單移動排序。</p></aside>
<main class="panel"><div id="editor"></div><div id="status" aria-live="polite"></div></main></div>
<div class="note" style="margin-top:24px">連接 GitHub 後，圖片原檔將上傳至 assets/，授權僅保留在本頁記憶體，重新整理即清除。上傳前請先連接 GitHub；JSON 匯出僅供備份。請勿分享權杖。</div></div>
<script>
(function(){
"use strict";
var key="portfolio-v7-draft",data={settings:{about:"Visual design across brands, formats and experiences.",email:"",autoplay:true,interval:6000},projects:[]},selected=null,mode="project";
var cats=["Campaign Design","Social & Digital","Event & Print","Typography & Visual Exploration"],brands=["SUZUKI","VOLVO","Panasonic","Personal","Other"];
var $=id=>document.getElementById(id);
var esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(data));$("status").textContent="已暫存於這台裝置的瀏覽器。請按「儲存並發布網站」或匯出 JSON。"}catch(e){$("status").textContent="瀏覽器暫存空間不足，請先匯出 JSON 保存。"}}
function options(arr,value){return arr.map(v=>'<option value="'+esc(v)+'" '+(v===value?"selected":"")+'>'+esc(v)+'</option>').join("")}
function init(){try{var draft=localStorage.getItem(key);if(draft){var d=JSON.parse(draft);if(Array.isArray(d.projects))data=d}}catch(e){}fetch("./projects.json?v="+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(!Array.isArray(d.projects))return;if(!localStorage.getItem(key)){data=d;render()}}).catch(()=>{});render()}
function render(){renderList();renderMain()}
function renderList(){$("items").innerHTML=data.projects.length?data.projects.map(p=>'<button type="button" class="project '+(p.id===selected&&mode==="project"?"active":"")+'" data-id="'+esc(p.id)+'"><span>'+esc(p.title||"未命名作品")+'<div class="meta">'+esc(p.brand||"")+'</div></span><span>→</span></button>').join(""):'<p class="help">尚未建立作品。請點擊新增作品。</p>';$("items").querySelectorAll(".project").forEach(b=>b.onclick=()=>{selected=b.dataset.id;mode="project";render()})}
function field(label,html,extra=""){return '<div class="field '+extra+'"><label>'+label+'</label>'+html+'</div>'}
function renderMain(){if(mode==="settings"){var s=data.settings;$("editor").innerHTML='<h2>網站基本設定</h2><div class="fields">'+field("About 介紹｜繁體中文",'<textarea id="aboutZh">'+esc(s.aboutZh||s.about||"")+'</textarea>',"full")+field("公開聯絡 Email",'<input id="email" type="email" value="'+esc(s.email||"")+'">')+field("輪播切換間隔（毫秒）",'<input id="interval" type="number" min="2000" step="1000" value="'+(Number(s.interval)||6000)+'">')+field("自動播放輪播",'<label class="check"><input id="autoplay" type="checkbox" '+(s.autoplay!==false?"checked":"")+'>啟用自動切換</label>',"full")+field("輪播比例",'<select id="heroRatio">'+options(["16:9","2.4:1","3:2","4:3","1:1"],s.heroRatio||"16:9")+'</select>')+field("圖片填充方式",'<select id="heroFit"><option value="cover" '+(s.heroFit!=="contain"?"selected":"")+'>滿版填充 Cover</option><option value="contain" '+(s.heroFit==="contain"?"selected":"")+'>完整顯示 Contain</option></select>')+field("垂直裁切位置（0% 上方、50% 置中、100% 下方）",'<input id="heroPosition" type="number" min="0" max="100" step="1" value="'+Math.max(0,Math.min(100,Number(s.heroPosition??50)||0))+'">',"full")+field("圖片尺寸指南",'<p class="help">輪播 16:9：1920 × 1080 px；作品封面 4:3：1800 × 1350 px。輪播與作品封面可分別上傳；精選作品封面完整顯示。詳情圖片建議寬 1920 px。</p>',"full")+'</div><div class="row"><button id="saveSettings">儲存設定</button></div>';$("saveSettings").onclick=()=>{data.settings={...s,aboutZh:$("aboutZh").value,email:$("email").value.trim(),interval:Math.max(2000,Number($("interval").value)||6000),autoplay:$("autoplay").checked,heroRatio:$("heroRatio").value,heroFit:$("heroFit").value,heroPosition:Math.max(0,Math.min(100,Number($("heroPosition").value)||0))};save();render()};return}
var i=data.projects.findIndex(p=>p.id===selected);if(i<0){$("editor").innerHTML='<h2>開始建立你的作品集</h2><p>請從左側點選「新增作品」，或開啟網站基本設定。作品封面尚未提供時，網站會使用簡潔的空白圖片區塊。</p>';return}
var p=data.projects[i];$("editor").innerHTML='<h2>編輯作品</h2><div class="fields">'+field("作品名稱｜繁體中文",'<input id="title" value="'+esc(p.title||"")+'">')+field("品牌",'<select id="brand">'+options(brands,p.brand)+'</select>')+field("作品分類",'<select id="category">'+options(cats,p.category)+'</select>')+field("首頁輪播",'<label class="check"><input id="hero" type="checkbox" '+(p.hero?"checked":"")+'>將這件作品加入首頁輪播（須另外上傳輪播專用圖片）</label>')+field("獨立輪播圖片路徑或網址",'<input id="heroImage" value="'+esc(p.heroImage||"")+'" placeholder="assets/hero.jpg"><p class="help">輪播專用，建議 1920 × 1080 px。留空則不加入輪播，不會沿用作品封面。</p>',"full")+field("上傳輪播專用圖片",'<input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp">',"full")+(p.heroImage?'<div class="full"><img class="preview" alt="輪播圖片預覽" src="'+esc(p.heroImage)+'"></div>':"")+field("作品簡介｜繁體中文",'<textarea id="description">'+esc(p.description||"")+'</textarea>',"full")+field("精選作品封面路徑或圖片網址",'<input id="cover" value="'+esc(p.cover||"")+'" placeholder="assets/cover.jpg 或 https://...">', "full")+field("或選取封面圖片",'<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"><p class="help">精選作品封面建議 1800 × 1350 px，完整顯示、不裁切。輪播請使用獨立輪播圖片欄位。連接 GitHub 後上傳原圖至 assets/；請先連接 GitHub。</p>',"full")+(p.cover?'<div class="full"><img id="coverPreview" class="preview" alt="封面預覽" src="'+esc(p.cover)+'"></div>':"")+field("作品封面說明（圖片右下方）",'<input id="coverCaption" value="'+esc(p.coverCaption||"")+'" placeholder="例如：品牌主視覺設計">',"full")+field("更多作品圖片（每行一個網址或 assets/ 路徑）",'<textarea id="gallery" placeholder="assets/project-01.jpg&#10;assets/project-02.jpg">'+esc((p.gallery||[]).join("\n"))+'</textarea>',"full")+field("延伸圖片說明（依圖片順序逐行填寫）",'<textarea id="galleryCaptions" placeholder="第一張圖片說明&#10;第二張圖片說明">'+esc((p.galleryCaptions||[]).join("\n"))+'</textarea><p class="help">每行對應一張延伸圖片；不需說明的圖片請保留空行。調整圖片順序時也請同步調整說明。</p>',"full")+field("或選取多張延伸圖片",'<input id="galleryFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple>',"full")+'</div><div class="row"><button id="saveProject">儲存作品</button><button class="ghost" id="up">↑ 上移</button><button class="ghost" id="down">↓ 下移</button><button class="ghost danger" id="remove">刪除作品</button></div>';
$("saveProject").onclick=()=>saveForm(p);
$("heroFile").onchange=async e=>{if(!e.target.files[0])return;try{$("heroImage").value=await uploadImage(e.target.files[0]);$("status").textContent="輪播圖片已載入，請按儲存作品。"}catch(err){$("status").textContent="圖片上傳失敗："+err.message}};
$("coverFile").onchange=async e=>{if(!e.target.files[0])return;try{$("status").textContent="正在處理封面圖…";$("cover").value=await uploadImage(e.target.files[0]);$("status").textContent="圖片已載入，請按「儲存作品」。";}catch(err){$("status").textContent="圖片上傳失敗："+err.message}};
$("galleryFiles").onchange=async e=>{var files=[...e.target.files];try{$("status").textContent="正在處理延伸圖片…";var list=[];for(var f of files)list.push(await uploadImage(f));$("gallery").value=[$("gallery").value,...list].filter(Boolean).join("\n");$("status").textContent="圖片已載入，請按「儲存作品」。"}catch(err){$("status").textContent="圖片處理失敗："+err.message}};
$("up").onclick=()=>move(i,-1);$("down").onclick=()=>move(i,1);$("remove").onclick=()=>{if(!confirm("確定要刪除這件作品嗎？"))return;data.projects.splice(i,1);selected=data.projects[0]?.id||null;save();render()}
}
function saveForm(p){p.title=$("title").value.trim()||"未命名作品";p.brand=$("brand").value;p.category=$("category").value;p.hero=$("hero").checked;p.description=$("description").value.trim();p.coverCaption=$("coverCaption").value.trim();p.galleryCaptions=$("galleryCaptions").value.split("\n").map(v=>v.trim());p.heroImage=$("heroImage").value.trim();p.cover=$("cover").value.trim();p.gallery=$("gallery").value.split("\n").map(v=>v.trim()).filter(Boolean);save();render()}
function move(i,n){var j=i+n;if(j<0||j>=data.projects.length)return;var x=data.projects.splice(i,1)[0];data.projects.splice(j,0,x);save();render()}
function compress(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("image/")){reject(Error("not image"));return}var fr=new FileReader();fr.onerror=reject;fr.onload=()=>{var img=new Image();img.onerror=reject;img.onload=()=>{var max=1920,ratio=Math.min(1,max/Math.max(img.width,img.height)),can=document.createElement("canvas");can.width=Math.round(img.width*ratio);can.height=Math.round(img.height*ratio);var ctx=can.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,can.width,can.height);ctx.drawImage(img,0,0,can.width,can.height);resolve(can.toDataURL("image/jpeg",0.8))};img.src=fr.result};fr.readAsDataURL(file)})}
$("add").onclick=()=>{var p={id:"p"+Date.now()+Math.random().toString(36).slice(2,6),title:"未命名作品",titleEn:"",brand:"SUZUKI",category:cats[0],description:"",descriptionEn:"",cover:"",gallery:[],hero:false};data.projects.push(p);selected=p.id;mode="project";save();render()};
$("settingsBtn").onclick=()=>{mode="settings";render()};
$("exportBtn").onclick=()=>{if(mode==="settings"&&$("saveSettings"))$("saveSettings").click();if(mode==="project"&&selected&&$("saveProject"))$("saveProject").click();var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="projects.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$("status").textContent="已下載 projects.json。請將它更新到 GitHub 儲存庫根目錄。"};
$("importBtn").onclick=()=>$("importInput").click();$("importInput").onchange=async e=>{var f=e.target.files[0];if(!f)return;try{var d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects))throw Error();if(!confirm("匯入後會取代目前編輯內容，確定嗎？"))return;data=d;data.settings ||= {};selected=null;mode="project";save();render()}catch(err){alert("無法讀取 JSON，請確認檔案格式。")}e.target.value=""};
var token="",busy=false,base="https://api.github.com/repos/vvv900610-cloud/portfolio-v7/contents/";
async function api(path,method="GET",body){var r=await fetch(base+path,{method,headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok){var detail=await r.json().catch(()=>({}));throw Error("GitHub HTTP "+r.status+"："+(detail.message||r.statusText)+(r.status===403?"（請確認 Contents 為 Read and write）":""));}return r.json()}
function b64(bytes){var out="";for(var i=0;i<bytes.length;i+=16384)out+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(out)}
async function uploadImage(file){if(!token)throw Error('請先連接 GitHub，再上傳圖片');var ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[file.type];if(!ext)throw Error("不支援的圖片格式");if(file.size>20*1024*1024)throw Error("單張圖片請小於 20 MB");var path="assets/"+crypto.randomUUID()+"."+ext;await api(path,"PUT",{message:"Upload portfolio image",content:b64(new Uint8Array(await file.arrayBuffer())),branch:"main"});return path}
$("connectBtn").onclick=async()=>{if(busy)return;if(token){token="";$("connectBtn").textContent="連接 GitHub";return}var v=prompt("請輸入限定 portfolio-v7 儲存庫、Contents 讀寫權限的 GitHub fine-grained token（僅本頁暫存）");if(!v)return;token=v.trim();try{await api("projects.json?ref=main");$("connectBtn").textContent="中斷 GitHub 連接";$("status").textContent="GitHub 已連接。"}catch(e){token="";alert("連接失敗："+e.message)}};
$("publishBtn").onclick=async()=>{if(busy)return;if(!token){alert("請先連接 GitHub");return}if(!confirm("確定將目前全部作品及設定發布至正式網站？"))return;busy=true;$("publishBtn").disabled=true;try{if(mode==="settings"&&$("saveSettings"))$("saveSettings").click();if(mode==="project"&&$("saveProject"))$("saveProject").click();var old=await api("projects.json?ref=main");await api("projects.json","PUT",{message:"Publish portfolio",content:b64(new TextEncoder().encode(JSON.stringify(data,null,2))),sha:old.sha,branch:"main"});$("status").textContent="已提交 GitHub，等待網站部署。"}catch(e){alert("發布失敗："+e.message)}finally{busy=false;$("publishBtn").disabled=false}};

init();
})();
</script></body></html>
